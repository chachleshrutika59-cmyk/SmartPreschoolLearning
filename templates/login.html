<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Login - Smart Preschool Learning</title>

    <link rel="stylesheet"
          href="{{ url_for('static', filename='css/style.css') }}">

</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            Smart <span>Preschool</span>
        </div>

        <a href="/register" class="nav-button">
            Register
        </a>

    </nav>


    <!-- Main -->

    <main class="main-container">

        <!-- Decorative Shapes -->

        <div class="circle circle-one"></div>
        <div class="circle circle-two"></div>
        <div class="circle circle-three"></div>


        <!-- Login Card -->

        <div class="login-card">

            <div class="icon">
                🎨
            </div>

            <h1>Welcome Back!</h1>

            <p class="subtitle">
                Let's learn, play and grow together 🌈
            </p>


            <form method="POST">

                <div class="form-group">

                    <label for="email">
                        Email
                    </label>

                    <input
                        type="email"
                        id="email"
                        name="email"
                        placeholder="Enter your email"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="password">
                        Password
                    </label>

                    <input
                        type="password"
                        id="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                    >

                </div>


                <button
                    type="submit"
                    class="login-button">

                    Login 🚀

                </button>

            </form>


            <div class="register-link">

                Don't have an account?

                <a href="/register">
                    Create Account
                </a>

            </div>

        </div>


        <!-- Bottom Color Bar -->

        <div class="color-bar"></div>

    </main>

</body>

</html>
